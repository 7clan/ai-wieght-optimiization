services:
  project-manager:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PROJECT_DB_PATH: /data/project-manager.sqlite
    volumes:
      - project_manager_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  project_manager_data:
