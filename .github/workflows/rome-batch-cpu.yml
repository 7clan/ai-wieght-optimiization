name: CPU 50-task multi-layer HumanEval batch edit

# First addition triggers the experiment. Later sessions can be dispatched
# manually; documentation-only updates will not launch extra compute runs.
on:
  push:
    paths:
      - .github/workflows/rome-batch-cpu.yml
  workflow_dispatch:

concurrency:
  group: rome-batch-cpu
  cancel-in-progress: false

jobs:
  cpu-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only Torch and other model dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check algebra, CLI, and Docker execution sandbox
        run: |
          python -m compileall -q tinycoder tests
          python -m unittest discover -s tests -v
          docker info
          docker pull python:3.11-alpine
      - name: CPU causal tracing, layers 8 and 12 batch edits, 50-task evaluation
        run: |
          python -m tinycoder.rome_batch --device cpu --threads 4 --holdout-start 44 --holdout-count 50 --max-relative-change 0.015 --batch-size 4 --workers 4 --output-dir experiments
      - name: Preserve real factors and before-after execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humaneval-cpu-batch-results
          path: |
            experiments/rome_batch_report.json
            experiments/rome_batch_factors.safetensors
            experiments/rome_batch_predictions.json
            experiments/rome_batch_progress.json
          if-no-files-found: warn
          retention-days: 14

  persist-results:
    needs: cpu-experiment
    if: ${{ needs.cpu-experiment.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: humaneval-cpu-batch-results
          path: experiments
      - name: Verify 50-task measurement and update README results
        run: |
          python -c "import json; from pathlib import Path; from tinycoder.rome_batch import update_readme; r = json.loads(Path('experiments/rome_batch_report.json').read_text()); assert r['status'] == 'completed' and r['hardware']['device'] == 'cpu'; assert r['independent_holdout_50']['n'] == 50; assert all(v['observed_relative_delta_norm'] <= 0.015001 for v in r['edits'].values()); assert Path('experiments/rome_batch_factors.safetensors').stat().st_size > 0; update_readme(Path('README.md'), r)"
      - name: Commit report, factor tensors, per-task predictions, and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md experiments/rome_batch_report.json experiments/rome_batch_factors.safetensors experiments/rome_batch_predictions.json experiments/rome_batch_progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified CPU batch-edit pass@1 and direct weight factors'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
