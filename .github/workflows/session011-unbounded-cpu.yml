name: Session 011 15-30-50 percent multi-layer CPU stress

on:
  push:
    branches:
      - exp/08-unbounded-norm
    paths:
      - .github/workflows/session011-unbounded-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/08-unbounded-norm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python and mathematical preflight
        run: |
          python -m compileall -q tinycoder tests
          python -m unittest discover -s tests -v
      - name: Install CPU PyTorch and validated inference dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Verify isolated test runner
        run: |
          docker info
          docker pull python:3.11-alpine
      - name: Derive four-layer closed-form factors and test all three norm levels
        run: |
          python -m tinycoder.session011 --track stress --output-dir outputs/session011_stress --batch-size 4 --workers 4
      - name: Upload task-level predictions, diagnostics and reversible tensors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session011-unbounded-stress
          path: outputs/session011_stress/
          if-no-files-found: warn
          retention-days: 30
