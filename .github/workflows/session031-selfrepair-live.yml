name: Session 031 Qwen0.5B self-repair architect with live deployment

on:
  push:
    branches: [exp/29-selfrepair-deployment]
    paths:
      - .github/workflows/session031-selfrepair-live.yml
      - tinycoder/session031.py
      - tinycoder/session031_contract.py
      - tinycoder/session031_worker.js
      - tinycoder/session031_py_worker.py
      - tinycoder/session031_reference_smoke.py
      - tinycoder/collect_session031.py
      - tests/test_session031.py
      - docker/session031-selfrepair.Dockerfile
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Total self-repair rounds (0-24)'
        default: '4'
        type: string
      wall_budget:
        description: 'Cumulative wall-clock budget in seconds'
        default: '14400'
        type: string
      resume:
        description: 'Resume from the published state file and keep improving'
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: session031-live
  cancel-in-progress: false

jobs:
  selfrepair-architect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove self-repair-only protocol and gallery safety
        run: |
          python -m compileall -q tinycoder/session031.py tinycoder/session031_contract.py tinycoder/collect_session031.py tinycoder/session031_reference_smoke.py
          python -m unittest discover -s tests -p 'test_session031.py' -v
          node --check tinycoder/session031_worker.js
      - name: Install frozen Qwen0.5B CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install -r requirements.txt
      - name: Build strict unprivileged offline evaluator
        run: |
          docker build -f docker/session017-fullstack.Dockerfile -t tinycoder-session017-fullstack:1 .
          docker build -f docker/session031-selfrepair.Dockerfile -t tinycoder-session031-selfrepair:1 .
          python -m tinycoder.session031_reference_smoke
      - name: Run autonomous self-repair generation on the NEW app
        run: |
          ROUNDS="${{ github.event.inputs.rounds || '4' }}"
          BUDGET="${{ github.event.inputs.wall_budget || '14400' }}"
          RESUME="${{ github.event.inputs.resume }}"
          if [ "$RESUME" = "true" ] && [ -f experiments/session031_selfrepair_state.json ]; then
            python -m tinycoder.session031 --output-dir outputs/session031 --rounds "$ROUNDS" --wall-budget "$BUDGET" --resume
          else
            python -m tinycoder.session031 --output-dir outputs/session031 --rounds "$ROUNDS" --wall-budget "$BUDGET"
          fi
      - name: Archive raw attempts even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session031-qwen-devmetrics-source
          path: outputs/session031/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify authorship and publish the live deployment gallery
        env:
          ESBUILD_BIN: /tmp/esbuild-tools/node_modules/.bin/esbuild
        run: |
          npm install --no-audit --no-fund --prefix /tmp/esbuild-tools --save-exact esbuild@0.25.9
          python -m tinycoder.collect_session031 --output-dir outputs/session031
          python -m json.tool experiments/session031_selfrepair_report.json > /dev/null
      - name: Commit genuinely Qwen-authored app, scores and gallery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/session031_selfrepair_report.json experiments/session031_selfrepair_predictions.json experiments/session031_selfrepair_state.json apps/devmetrics-qwen-selfrepair docs/gallery/session031 docs/index.html docs/previews/session031
          git commit -m 'Publish measured Qwen0.5B self-repair round and live gallery' || echo 'Nothing to commit'
          git pull --rebase origin exp/29-selfrepair-deployment || true
          git push origin HEAD:exp/29-selfrepair-deployment

  deploy-live-gallery:
    needs: selfrepair-architect
    if: needs.selfrepair-architect.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/29-selfrepair-deployment
      - name: Enable Pages (first time only) and configure
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the docs/ gallery artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy the live mission gallery
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report the live URL
        run: |
          echo "Live mission gallery: ${{ steps.deployment.outputs.page_url }}"
          echo "Session 031 gallery:  ${{ steps.deployment.outputs.page_url }}gallery/session031/"
