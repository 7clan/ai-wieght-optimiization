name: Session 028 teach 0.5B by observing corrections

on:
  push:
    branches: [exp/26-targeted-mentor]
    paths:
      - .github/workflows/session028-targeted-mentor.yml
      - tinycoder/session028.py
      - tinycoder/session028_contract.py
      - tinycoder/session028_worker.js
      - tinycoder/session028_reference_smoke.py
      - tinycoder/collect_session028.py
      - tests/test_session028.py
      - docker/session028-mentored-app.Dockerfile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qwen-observes-and-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate mentor protocol before expensive computation
        run: |
          python -m compileall -q tinycoder/session028.py tinycoder/session028_contract.py tinycoder/collect_session028.py
          python -m unittest discover -s tests -p 'test_session028.py' -v
          node --check tinycoder/session028_worker.js
      - name: Install frozen Qwen 0.5B CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install -r requirements.txt 'evalplus==0.3.1'
      - name: Build and verify the restricted evaluator
        run: |
          docker build -f docker/session017-fullstack.Dockerfile -t tinycoder-session017-fullstack:1 .
          docker build -f docker/session028-mentored-app.Dockerfile -t tinycoder-session028-mentored:1 .
          python -m tinycoder.session028_reference_smoke
      - name: Qwen independently regenerates failing modules from teacher analogies
        run: python -m tinycoder.session028 --output-dir outputs/session028
      - name: Preserve raw model attempts even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session028-qwen-mentored-source
          path: outputs/session028/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify provenance, publish measured result and safe preview
        run: |
          python -m tinycoder.collect_session028 --output-dir outputs/session028
          python -m json.tool experiments/session028_mentor_report.json > /dev/null
      - name: Commit model source, diaries and outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/session028_mentor_report.json experiments/session028_mentor_predictions.json docs/previews/session028
          git commit -m 'Publish Qwen mentor-round source and isolated outcomes'
          git push origin HEAD:exp/26-targeted-mentor
