name: Session 026 transfer-oriented mentor memory validation

on:
  push:
    branches: [exp/24-transfer-pattern-memory]
    paths:
      - .github/workflows/session026-pattern-memory-ci.yml
      - tinycoder/mentor_patterns.py
      - tests/test_mentor_patterns.py
      - experiments/session026_reasoning_patterns.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check deterministic memory retrieval and provenance boundaries
        run: python -m unittest tests.test_mentor_patterns -v
      - name: Demonstrate context-specific reasoning checklist
        run: |
          python -m tinycoder.mentor_patterns --domain express --task 'Write Express DELETE route for notes using the documented store interface'
          python -m tinycoder.mentor_patterns --domain python --task 'Return the sum of a numeric list'
