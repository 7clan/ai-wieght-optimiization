name: Session 030 Qwen0.5B teacher-pattern transfer to unseen ShelfStock

on:
  push:
    branches: [exp/28-learner-transfer]
    paths:
      - .github/workflows/session030-qwen-transfer.yml
      - tinycoder/session030.py
      - tinycoder/session030_contract.py
      - tinycoder/session030_worker.js
      - tinycoder/session030_reference_smoke.py
      - tinycoder/collect_session030.py
      - tests/test_session030.py
      - docker/session030-transfer.Dockerfile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qwen-learner:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove fresh-task and student-authorship protocol
        run: |
          python -m compileall -q tinycoder/session030.py tinycoder/session030_contract.py tinycoder/collect_session030.py
          python -m unittest discover -s tests -p 'test_session030.py' -v
          node --check tinycoder/session030_worker.js
      - name: Install frozen Qwen0.5B CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install -r requirements.txt 'evalplus==0.3.1'
      - name: Build strict unprivileged offline evaluator
        run: |
          docker build -f docker/session017-fullstack.Dockerfile -t tinycoder-session017-fullstack:1 .
          docker build -f docker/session030-transfer.Dockerfile -t tinycoder-session030-transfer:1 .
          python -m tinycoder.session030_reference_smoke
      - name: Baseline and teacher-memory model generation on NEW app
        run: python -m tinycoder.session030 --output-dir outputs/session030
      - name: Archive raw attempts even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session030-qwen-unseen-app-source
          path: outputs/session030/
          if-no-files-found: warn
          retention-days: 30
      - name: Reproduce and publish isolated metrics plus script-free preview
        run: |
          python -m tinycoder.collect_session030 --output-dir outputs/session030
          python -m json.tool experiments/session030_transfer_report.json > /dev/null
      - name: Commit genuinely Qwen-authored ShelfStock modules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/session030_transfer_report.json experiments/session030_transfer_predictions.json docs/previews/session030
          git commit -m 'Publish measured Qwen0.5B generalization after teacher corrections'
          git push origin HEAD:exp/28-learner-transfer
