name: Session 017 contract-first full-stack 0.5B CPU suite

on:
  push:
    branches: [exp/15-contract-first-fullstack]
    paths:
      - .github/workflows/session017-fullstack-cpu.yml
      - tinycoder/session017.py
      - tinycoder/session017_contracts.py
      - tinycoder/session017_scaffold.py
      - tinycoder/session017_py_worker.py
      - tinycoder/session017_worker.js
      - tinycoder/collect_session017.py
      - docker/session017-fullstack.Dockerfile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install -r requirements.txt "evalplus==0.3.1"
      - name: Run trusted contract checks and syntax verification
        run: |
          python -m compileall -q tinycoder/session017.py tinycoder/session017_contracts.py tinycoder/session017_scaffold.py tinycoder/session017_py_worker.py tinycoder/collect_session017.py
          python -m unittest discover -s tests -p 'test_session017.py' -v
      - name: Build isolated full-stack Docker image
        run: |
          docker build -f docker/session017-fullstack.Dockerfile -t tinycoder-session017-fullstack:1 .
      - name: Generate, repair, integrate and holdout-score ten mini-apps
        run: |
          python -m tinycoder.session017 --output-dir outputs/session017
      - name: Preserve all evidence and archived application files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session017-applications-and-diagnostics
          path: outputs/session017/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify exact reports; do not invent measurements
        run: |
          python -m tinycoder.collect_session017 --output-dir outputs/session017
          python -m json.tool experiments/session017_fullstack_report.json > /dev/null
      - name: Publish verified report and predictions
        uses: actions/upload-artifact@v4
        with:
          name: session017-verified-report
          path: |
            experiments/session017_fullstack_report.json
            experiments/session017_fullstack_predictions.json
            README.md
      - name: Commit verified benchmark metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md experiments/session017_fullstack_report.json experiments/session017_fullstack_predictions.json
          git commit -m 'Publish Session017 frozen full-stack vertical slice results'
          git push origin HEAD:exp/15-contract-first-fullstack
