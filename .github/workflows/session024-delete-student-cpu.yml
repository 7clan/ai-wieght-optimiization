name: Session 024 Qwen student repairs final DELETE

on:
  push:
    branches: [exp/22-live-mentor-delete]
    paths:
      - .github/workflows/session024-delete-student-cpu.yml
      - tinycoder/session024.py
      - tinycoder/collect_session024.py
      - tinycoder/publish_session024_links.py
      - tests/test_session024.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  student-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unmodified Qwen0.5B CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install -r requirements.txt 'evalplus==0.3.1'
      - name: Check test protocol
        run: |
          python -m compileall -q tinycoder/session024.py tinycoder/collect_session024.py tinycoder/publish_session024_links.py
          python -m unittest discover -s tests -p 'test_session024.py' -v
      - name: Build model execution sandbox
        run: |
          docker build -f docker/session017-fullstack.Dockerfile -t tinycoder-session017-fullstack:1 .
          docker build -f docker/session022-generated-app.Dockerfile -t tinycoder-session022-generated:1 .
      - name: Watch student learn from teacher and repeat DELETE
        run: python -m tinycoder.session024 --output-dir outputs/session024
      - name: Keep model attempts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen0p5b-session024-student-delete-repair
          path: outputs/session024/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify student attribution and publish lesson
        run: |
          python -m tinycoder.collect_session024 --output-dir outputs/session024
          python -m json.tool experiments/session024_student_repair_report.json > /dev/null
      - name: Commit measured Qwen source and mentor replay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md experiments/session024_student_repair_report.json experiments/session024_student_repair_predictions.json docs/previews/session024
          git commit -m 'Publish final Qwen mentor-guided DELETE repair and measured result'
          git push origin HEAD:exp/22-live-mentor-delete
      - name: Pin visual results to immutable Git SHA
        run: |
          python -m tinycoder.publish_session024_links --revision "$(git rev-parse HEAD)"
          git add README.md
          git commit -m 'Pin Qwen student repair preview links'
          git push origin HEAD:exp/22-live-mentor-delete
