name: MEMIT-style batch algebra and safety checks

on:
  push:
    paths:
      - .github/workflows/rome-batch-checks.yml
      - tinycoder/rome_batch.py
      - tests/test_rome_batch.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch to test algebra without promising CUDA results
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compile and validate all unit tests
        run: |
          python -m compileall -q tinycoder tests
          python -m unittest discover -s tests -v
      - name: Confirm no unapproved CPU fallback in the GPU protocol
        run: |
          python -m tinycoder.rome_batch --help
